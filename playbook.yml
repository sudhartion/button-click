---
- name: Configure application server
  hosts: button-click-server
  become: true
  tasks:
    - name: Copy application server executable
      ansible.builtin.copy:
        src: build/button-click
        dest: /root/
        mode: preserve
    - name: Copy systemd service file
      ansible.builtin.copy:
        src: button-click.service
        dest: /etc/systemd/system/
    - name: Reload systemd units
      ansible.builtin.command:
        cmd: systemctl daemon-reload
    - name: Set SELinux context for executable file
      ansible.builtin.command:
        cmd: chcon --verbose --type bin_t /root/button-click
    - name: Run application server
      ansible.builtin.systemd_service:
        name: button-click
        state: restarted
        enabled: true

- name: Configure web server
  hosts: button-click-server
  become: true
  tasks:
    - name: Install NGINX
      ansible.builtin.dnf:
        name: nginx
        state: latest
    - name: Create site directory
      ansible.builtin.file:
        path: /usr/share/www/
        state: directory
    - name: Copy site files
      ansible.builtin.copy:
        src: web/
        dest: /usr/share/www
    - name: Copy web server config
      ansible.builtin.copy:
        src: button-click.conf
        dest: /etc/nginx/conf.d/button-click.conf
    - name: Copy certificate files
      ansible.builtin.copy:
        src: ".github/{{ item }}"
        dest: "/root/{{ item }}"
        mode: preserve
      loop:
        - cert-chain
        - cert-key
    - name: Set SELinux context for certificate files
      ansible.builtin.command:
        cmd: "chcon --verbose --type httpd_config_t /root/{{ item }}"
      loop:
        - cert-chain
        - cert-key
    - name: Set SELinux boolean for web modules to connect
      ansible.builtin.command:
        cmd: setsebool -P httpd_can_network_connect true
    - name: Run NGINX
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
        enabled: true

- name: Update DNS
  hosts: button-click-server
  tasks:
    - name: Create DNS directory
      ansible.builtin.file:
        path: dns/
        state: directory
    - name: Copy token and update script
      ansible.builtin.copy:
        src: ".github/{{ item }}"
        dest: "dns/{{ item }}"
        mode: preserve
      loop:
        - set-dns-token.sh
        - update-dns.sh
    - name: Run DNS update
      ansible.builtin.shell:
        chdir: dns/
        cmd: source ./set-dns-token.sh && ./update-dns.sh
