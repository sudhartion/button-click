server {
    server_name sudhartion.duckdns.org;
    listen 80;
    listen 443 ssl;

    ssl_certificate /root/cert-chain;
    ssl_certificate_key /root/cert-key;

    root /usr/share/www;

    location = /favicon.ico {
        return 204;
    }

    location = / {
        try_files /index.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri @appserver;
    }

    location @appserver {
        proxy_pass http://localhost:3000;
    }
}
